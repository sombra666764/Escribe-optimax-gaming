name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Repair and Build APK
      run: |
        # 1. Buscar la carpeta del proyecto
        GRADLE_PATH=$(find . -name "build.gradle" -not -path "*/app/*" | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLE_PATH")
        cd "$PROJECT_DIR"
        echo "Proyecto en: $PROJECT_DIR"

        # 2. CREAR EL ARCHIVO QUE FALTA (settings.gradle)
        # Esto le dice a GitHub que use los servidores de Google
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "rootProject.name = 'OptiMaxGamingEdition'" >> settings.gradle
        echo "include ':app'" >> settings.gradle

        # 3. Preparar y compilar
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: optimax-app
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
